[package]
name = "program-microscope"
version = "0.2.0"
description = "A GUI-first microscope for Windows program execution"
authors = ["QuJindai"]
edition = "2021"

[lib]
name = "program_microscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

